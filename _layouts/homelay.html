<style>
/* 已去除 body 背景 logo，避免重叠 */
#homeid.home-center {
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
.carousel-fullwidth-wrapper {
  width: 100%; /* 修复：由100vw改为100%，避免左侧空隙 */
  position: relative;
  left: 0;
  right: 0;
  margin: 0;
  overflow: hidden;
  background: #fff;
  z-index: 0;
}
#myCarousel.carousel {
  width: 100%;
  margin: 0;
  border-radius: 0;
}
.carousel-inner, .carousel-inner .item, .carousel-inner .item img {
  height: 100%;
  margin: 0;
  padding: 0;
}
.carousel-inner {
  width: 100% !important;
}
.carousel-inner .item img {
  width: 100%;
  height: 800px;
  object-fit: cover;
  display: block;
}
.carousel-caption-custom {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 24px;
  margin: 0;
  padding: 0;
  pointer-events: none;
  display: flex; /* 新增：使用flex布局 */
  align-items: center; /* 新增：垂直居中 */
  justify-content: center; /* 新增：水平居中 */
  height: 80px; /* 新增：与黑色背景高度一致 */
}
.carousel-caption-bg {
  background-color: rgba(0,0,0,0.9);
  width: 100%;
  position: absolute;
  bottom: 0;
  left: 0;
  z-index: 1;
  height: 80px; /* 修改：只显示底部80px的黑色背景 */
  top: auto;    /* 修改：不再覆盖整个图片 */
  padding: 0;
  display: block;
}
.carousel-caption-text {
  color: #66B3FF;
  opacity: 0;
  transition: opacity 0.6s;
  z-index: 2;
  pointer-events: auto;
  font-size: 30px;
  font-weight: bold;
}
.carousel-caption-text.show {
  opacity: 1;
}
.carousel-inner .item.active .carousel-caption-text {
  opacity: 1;
  transition: opacity 0.6s;
  pointer-events: auto;
}
.carousel-indicators {
  display: none !important;
}
.left.carousel-control, .right.carousel-control {
  top: 50%;
  transform: translateY(-50%);
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.left.carousel-control {
  left: 10px !important;
}
.right.carousel-control {
  right: 10px !important;
}
body {
  padding-top: 0 !important;
}
</style>

<script>
$(function(){
  var isSliding = false;
  var $carousel = $('#myCarousel');
  var $items = $carousel.find('.item');
  var captionFadeDuration = 600;
  var $captionText = $('#global-carousel-caption .carousel-caption-text');
  var $captionBg = $('#global-carousel-caption .carousel-caption-bg');

  function getActiveIndex() {
    return $items.index($carousel.find('.item.active'));
  }
  function getCaption(idx) {
    return $items.eq(idx).attr('data-caption') || '';
  }
  function showCaption(idx) {
    $captionText.text(getCaption(idx));
    $captionText.addClass('show');
  }
  function hideCurrentCaption() {
    $captionText.removeClass('show');
    // 移除setTimeout回调逻辑
  }
  // 初始化
  $captionText.removeClass('show');
  showCaption(0);

  // 修改左右控制按钮事件
  $('.left.carousel-control, .right.carousel-control').off('click').on('click', function(e){
    e.preventDefault();
    $carousel.carousel('pause').carousel('cycle');

    if(isSliding) return;

    isSliding = true;
    const dir = $(this).hasClass('left') ? 'prev' : 'next';

    // 立即触发轮播切换（不再等待caption动画）
    $carousel.carousel(dir);

    // 并行处理caption隐藏
    hideCurrentCaption();
  });

  // 修改指示器点击事件（同样逻辑）
  $('.carousel-indicators li').off('click').on('click', function(e){
    e.preventDefault();
    $carousel.carousel('pause').carousel('cycle');

    if(isSliding) return;

    const idx = $(this).data('slide-to');
    if(idx === getActiveIndex()) return;

    isSliding = true;
    $carousel.carousel(idx); // 立即切换
    hideCurrentCaption(); // 并行处理
  });

  $carousel.on('slid.bs.carousel', function(){
    var idx = getActiveIndex();
    showCaption(idx);
    isSliding = false;
  });
});
</script>
