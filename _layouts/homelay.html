---
layout: default
---
<style>
/* 已去除 body 背景 logo，避免重叠 */
#homeid.home-center {
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
.carousel-fullwidth-wrapper {
  width: 100%; /* 修复：由100vw改为100%，避免左侧空隙 */
  position: relative;
  left: 0;
  right: 0;
  margin: 0;
  overflow: hidden;
  background: #fff;
  z-index: 0;
}
#myCarousel.carousel {
  width: 100%;
  margin: 0;
  border-radius: 0;
}
.carousel-inner, .carousel-inner .item, .carousel-inner .item img {
  height: 100%;
  margin: 0;
  padding: 0;
}
.carousel-inner {
  width: 100% !important;
}
.carousel-inner .item img {
  width: 100%;
  height: 800px;
  object-fit: cover;
  display: block;
}
.carousel-caption-custom {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 24px;
  margin: 0;
  padding: 0;
  pointer-events: none;
  display: flex; /* 新增：使用flex布局 */
  align-items: center; /* 新增：垂直居中 */
  justify-content: center; /* 新增：水平居中 */
  height: 80px; /* 新增：与黑色背景高度一致 */
}
.carousel-caption-bg {
  background-color: rgba(0,0,0,0.9);
  width: 100%;
  position: absolute;
  bottom: 0;
  left: 0;
  z-index: 1;
  height: 80px; /* 修改：只显示底部80px的黑色背景 */
  top: auto;    /* 修改：不再覆盖整个图片 */
  padding: 0;
  display: block;
}
.carousel-caption-text {
  color: #66B3FF;
  opacity: 0;
  transition: opacity 0.6s;
  z-index: 2;
  pointer-events: auto;
  font-size: 30px;
  font-weight: bold;
}
.carousel-caption-text.show {
  opacity: 1;
}
.carousel-inner .item.active .carousel-caption-text {
  opacity: 1;
  transition: opacity 0.6s;
  pointer-events: auto;
}
.carousel-indicators {
  display: none !important;
}
.left.carousel-control, .right.carousel-control {
  top: 50%;
  transform: translateY(-50%);
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.left.carousel-control {
  left: 10px !important;
}
.right.carousel-control {
  right: 10px !important;
}
body {
  padding-top: 0 !important;
}
.slider-zoom-link {
  display: block;
  width: 100%;
  height: 100%;
  cursor: zoom-in;
}
.slider-zoom-link img {
  transition: opacity 0.2s;
}
.slider-zoom-link:hover img {
  opacity: 0.92;
}
</style>
<link rel="stylesheet" href="{{ site.url }}{{ site.baseurl }}/lib/bootstrap.min.css">
<script src="{{ site.url }}{{ site.baseurl }}/lib/jquery/jquery-1.11.0.min.js"></script>
<script src="{{ site.url }}{{ site.baseurl }}/lib/bootstrap/js/bootstrap.min.js"></script>
<div class="carousel-fullwidth-wrapper">
  <div id="myCarousel" class="carousel slide" data-ride="carousel" data-interval="5000" data-pause="hover">
    <!-- 轮播（Carousel）指标 — 由 _data/slider.yml 自动生成 -->
    <ol class="carousel-indicators car">
      {% assign visible_slides = site.data.slider | where_exp: "s", "s.hidden != true" %}
      {% for slide in visible_slides %}
        <li data-target="#myCarousel" data-slide-to="{{ forloop.index0 }}"{% if forloop.first %} class="active"{% endif %}></li>
      {% endfor %}
    </ol>
    <!-- 轮播（Carousel）项目 — 由 _data/slider.yml 自动生成 -->
    <div class="carousel-inner" style="height:950px;">
      {% for slide in visible_slides %}
        {% assign show_caption = slide.caption | default: '' %}
        <div class="item{% if forloop.first %} active{% endif %}"{% if show_caption != '' and slide.no_caption != true %} data-caption="{{ slide.caption | escape }}"{% endif %}>
          <a href="{{ site.url }}{{ site.baseurl }}/images/slider/{{ slide.file }}" target="_blank" rel="noopener" class="slider-zoom-link" title="点击查看原图 / Click for full resolution">
            <img src="{{ site.url }}{{ site.baseurl }}/images/slider/{{ slide.thumb }}" alt="{% if show_caption != '' and slide.no_caption != true %}{{ slide.caption | escape }} (click for full size){% else %}{{ slide.file | replace: '.JPG' | replace: '.jpg' | replace: '_' | capitalize }} (click for full size){% endif %}" style="width:100%;height:100%;object-fit:cover;">
          </a>
        </div>
      {% endfor %}
    </div>
    <!-- 左右切换按钮 -->
    <a class="left carousel-control" href="#myCarousel" data-slide="prev" style="background:none; left: 10px;">
      <span style="font-size:36px;line-height:1;">&lt;</span>
    </a>
    <a class="right carousel-control" href="#myCarousel" data-slide="next" style="background:none; right: 10px;">
      <span style="font-size:36px;line-height:1;">&gt;</span>
    </a>
  </div>
  <!-- 全局唯一caption容器 -->
  <span id="global-carousel-caption" class="carousel-caption-custom" style="pointer-events:auto;">
    <span class="carousel-caption-bg"></span>
    <span class="carousel-caption-text"></span>
  </span>
</div>
<!-- <div style="font-size:20px;max-width:1200px;margin:40px auto 0 auto;padding-left:200px;padding-right:200px;"> -->
<!-- 文字区域 about the lab -->
<div style="width: 100%; text-align: left; padding-left: 1vw; padding-right: 1vw; box-sizing: border-box;">
  {{ content }}
</div>

<script>
$(function(){
  var isSliding = false;
  var $carousel = $('#myCarousel');
  var $items = $carousel.find('.item');
  var captionFadeDuration = 600;
  var $captionText = $('#global-carousel-caption .carousel-caption-text');
  var $captionBg = $('#global-carousel-caption .carousel-caption-bg');

  function getActiveIndex() {
    return $items.index($carousel.find('.item.active'));
  }
  function getCaption(idx) {
    return $items.eq(idx).attr('data-caption') || '';
  }
  function showCaption(idx) {
    var text = getCaption(idx);
    if (text && text.trim().length > 0) {
      // 有 caption：显示文字 + 黑色背景
      $captionText.text(text).addClass('show');
      $captionBg.css('display', 'block');
    } else {
      // 没 caption：完全隐藏
      $captionText.removeClass('show').text('');
      $captionBg.css('display', 'none');
    }
  }
  function hideCurrentCaption() {
    $captionText.removeClass('show');
  }
  // 初始化
  $captionText.removeClass('show');
  showCaption(0);

  // 修改左右控制按钮事件
  $('.left.carousel-control, .right.carousel-control').off('click').on('click', function(e){
    e.preventDefault();
    $carousel.carousel('pause').carousel('cycle');

    if(isSliding) return;

    isSliding = true;
    const dir = $(this).hasClass('left') ? 'prev' : 'next';

    // 立即触发轮播切换（不再等待caption动画）
    $carousel.carousel(dir);

    // 并行处理caption隐藏
    hideCurrentCaption();
  });

  // 修改指示器点击事件（同样逻辑）
  $('.carousel-indicators li').off('click').on('click', function(e){
    e.preventDefault();
    $carousel.carousel('pause').carousel('cycle');

    if(isSliding) return;

    const idx = $(this).data('slide-to');
    if(idx === getActiveIndex()) return;

    isSliding = true;
    $carousel.carousel(idx); // 立即切换
    hideCurrentCaption(); // 并行处理
  });

  $carousel.on('slid.bs.carousel', function(){
    var idx = getActiveIndex();
    showCaption(idx);
    isSliding = false;
  });
});
</script>
