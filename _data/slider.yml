# Homepage carousel images
#
# ===== How to add a new image =====
# 1. Copy the image to images/slider/<name>.jpg
# 2. Run: ./scripts/optimize_slider.sh images/slider/<name>.jpg
#    (This creates images/slider/thumbs/<name>.jpg without touching the original.)
# 3. Add 4 lines at the TOP of this file:
#      - file: <name>.jpg
#        thumb: thumbs/<name>.jpg
#        caption: "English caption here"
#        caption_zh: "中文描述（可选）"
# 4. Commit + push. Site auto-rebuilds.
#
# ===== New images go at the TOP =====
# First image = first slide shown (active).
# `hidden: true` to skip without deleting (e.g. photo_260113_1 below).
#
# ===== Click-to-zoom =====
# The original image (file) is shown when the user clicks the thumb on the homepage.
# Don't delete the original — only the thumb is what shows in the carousel.

