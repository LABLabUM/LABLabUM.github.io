  content: |
    <p>We are delighted to announce that our PhD student, Connie, Keyi KANG, successfully defended her doctoral thesis on 22 June 2026 at the University of Macau.</p>
    <p><b>Thesis title</b> &mdash; <i>The Contribution of Semantic Representation Attributes to Lexical Retrieval during Production</i></p>
    <p><b>Supervisor</b> &mdash; Prof. Haoyun ZHANG<br>
    <b>Co-Supervisor</b> &mdash; Prof. Rucy-Song HUANG<br>
    <b>Committee</b> &mdash; Prof. Anise Man Sze WU (Chair), Prof. Quansheng XIA, Prof. Ming YAN, Prof. Cheng Teng IP</p>
    <p>Congratulations, Dr. KANG! We are proud of you and wish you all the best in your future career. 🎓</p>
    <p>祝贺康可依（Connie, Keyi KANG）博士于 2026 年 6 月 22 日在澳门大学顺利通过博士论文答辩，正式获得博士学位！</p>
    <p><b>论文题目</b> &mdash; <i>语义表征属性对词汇产出提取的贡献</i></p>
    <p><b>导师</b> &mdash; 张灏云教授<br>
    <b>副导师</b> &mdash; 黄茹倩教授<br>
    <b>答辩委员会</b> &mdash; 吴敏思教授（主席）、夏泉生教授、严明教授、叶郑庭教授</p>
    <p>康博士是我们 LAB Lab 的首位博士生毕业生。感谢她三年多的付出与陪伴，祝愿她前程似锦、未来可期！🎓</p>

